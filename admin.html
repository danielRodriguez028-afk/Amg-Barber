
<!DOCTYPE html>
<html lang="es">
<head>
  
<link rel="manifest" href="./admin-manifest.json">
<meta name="theme-color" content="#0b0b0b">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel privado | AMG BARBER</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #0b0b0b;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }
    main { max-width: 850px; margin: 35px auto; }
    .card {
      background: #171717;
      border: 1px solid #6f5728;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 18px;
    }
    h1, h2 { color: #d9b568; }
    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: 8px;
      font-size: 16px;
    }
    input {
      color: white;
      background: #101010;
      border: 1px solid #555;
    }
    button {
      cursor: pointer;
      border: 0;
      background: #d9b568;
      color: #111;
      font-weight: bold;
    }
    button:disabled { opacity: .55; }
    .secondary {
      background: #333;
      color: white;
    }
    .cancel {
      background: #782e2e;
      color: white;
    }
    .muted { color: #bbb; font-size: 14px; }
    .status { color: #e9c879; font-weight: bold; }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    #mensaje { white-space: pre-wrap; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>AMG BARBER</h1>
    <p class="muted">Panel privado de administración</p>
  </header>

  <section class="card" id="login">
    <h2>Iniciar sesión</h2>
    <form id="formLogin">
      <input id="correo" type="email"
        placeholder="Correo del barbero"
        autocomplete="username" required>
      <input id="contrasena" type="password"
        placeholder="Contraseña"
        autocomplete="current-password" required>
      <button id="btnLogin" type="submit">
        Entrar al panel
      </button>
    </form>
  </section>

  <section id="panel" hidden>
    <div class="card">
      <h2>Administrar citas</h2>
      <p id="bienvenida" class="muted"></p>
      <button id="btnActualizar" type="button">
        Actualizar citas
      </button>
      <button id="btnSalir" class="secondary" type="button">
        Cerrar sesión
      </button>
    </div>
    <div id="reservas"></div>
  </section>

  <section class="card">
    <p id="mensaje" class="muted" role="status">
      Inicia sesión para continuar.
    </p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL =
    "https://omptefmybwlhehgixkwa.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_2CWnYeLNuhix-vM4uRg2KA__1Clvgnf";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const login = document.getElementById("login");
  const panel = document.getElementById("panel");
  const mensaje = document.getElementById("mensaje");
  const lista = document.getElementById("reservas");

  function decir(texto) {
    mensaje.textContent = texto;
  }

  function escapar(valor) {
    return String(valor ?? "").replace(/[&<>"']/g, c => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[c]);
  }

  function mostrarSesion(sesion) {
    login.hidden = !!sesion;
    panel.hidden = !sesion;

    if (sesion) {
      document.getElementById("bienvenida").textContent =
        "Sesión iniciada: " + sesion.user.email;
    } else {
      lista.replaceChildren();
      decir("Inicia sesión para continuar.");
    }
  }

  
async function cargarReservas() {
  lista.replaceChildren();
  decir("Cargando citas...");

  const { data, error } = await db
    .from("reservas")
    .select("id,nombre,telefono,servicio,fecha,hora,estado,cliente_id")
    .order("fecha", { ascending: true })
    .order("hora", { ascending: true });

  if (error) {
    console.error(error);
    decir("No se pudieron cargar las citas. Comprueba tu sesión y los permisos.");
    return;
  }

  decir(data.length
    ? "Citas encontradas: " + data.length
    : "Todavía no hay citas.");

  data.forEach(cita => {
    const tarjeta = document.createElement("article");
    tarjeta.className = "card";

    tarjeta.innerHTML = `
      <h2>${escapar(cita.nombre)}</h2>
      <p>Teléfono: ${escapar(cita.telefono)}</p>
      <p>Servicio: ${escapar(cita.servicio)}</p>
      <p>Fecha: ${escapar(cita.fecha)}</p>
      <p>Hora: ${escapar(String(cita.hora).slice(0, 5))}</p>
      <p>Estado: <span class="status">${escapar(cita.estado)}</span></p>
    `;

    const acciones = document.createElement("div");
    acciones.className = "actions";

    if (cita.estado === "pendiente") {
      const confirmar = document.createElement("button");
      confirmar.textContent = "Confirmar";
      confirmar.addEventListener("click", () =>
        cambiarEstado(cita.id, "confirmada", cita.estado)
      );
      acciones.appendChild(confirmar);
    }
    
if (cita.estado === "confirmada") {
  const completar = document.createElement("button");
  completar.textContent = "Completar cita";

  completar.addEventListener("click", async () => {
    const mensaje = cita.cliente_id
      ? "¿Confirmas que el cliente terminó su corte? Se registrará en su tarjeta de fidelidad."
      : "¿Confirmas que esta cita terminó? No tiene una cuenta vinculada para sumar fidelidad.";

    if (!confirm(mensaje)) return;

    completar.disabled = true;
    completar.textContent = "Procesando...";

    try {
      const { data, error } = await db.rpc(
        "completar_reserva_con_fidelidad",
        { p_reserva_id: cita.id }
      );

      if (error) throw error;

      if (data && data.exito) {
        alert(data.mensaje || "Cita completada correctamente.");
        await cargarReservas();
      } else {
        throw new Error("No se pudo completar la cita.");
      }
    } catch (error) {
      console.error("Error al completar la cita:", error);
      alert(
        "No se pudo completar la cita: " +
        (error.message || "Error desconocido")
      );
      completar.disabled = false;
      completar.textContent = "Completar cita";
    }
  });

  acciones.appendChild(completar);
}
    
    if (cita.estado === "pendiente" || cita.estado === "confirmada") {
      const reagendar = document.createElement("button");
      reagendar.textContent = "Reagendar";
      reagendar.className = "secondary";
      reagendar.addEventListener("click", () =>
        mostrarFormularioReagendar(cita, tarjeta)
      );
      acciones.appendChild(reagendar);

      const cancelar = document.createElement("button");
      cancelar.textContent = "Cancelar cita";
      cancelar.className = "cancel";
      cancelar.addEventListener("click", () =>
        cambiarEstado(cita.id, "cancelada", cita.estado)
      );
      acciones.appendChild(cancelar);
    }

    if (cita.estado === "cancelada") {
      const restaurar = document.createElement("button");
      restaurar.textContent = "Restaurar cita";
      restaurar.addEventListener("click", () =>
        restaurarCita(cita)
      );
      acciones.appendChild(restaurar);
    }

    if (acciones.childElementCount) {
      tarjeta.appendChild(acciones);
    }

    lista.appendChild(tarjeta);
  });
}

function mostrarFormularioReagendar(cita, tarjeta) {
  const anterior = tarjeta.querySelector(".form-reagendar");

  if (anterior) {
    anterior.remove();
    return;
  }

  const formulario = document.createElement("form");
  formulario.className = "form-reagendar";
  formulario.style.marginTop = "16px";

  const etiquetaFecha = document.createElement("label");
  etiquetaFecha.textContent = "Nueva fecha";

  const fecha = document.createElement("input");
  fecha.type = "date";
  fecha.required = true;
  fecha.value = cita.fecha;

  const etiquetaHora = document.createElement("label");
  etiquetaHora.textContent = "Nueva hora";

  const hora = document.createElement("input");
  hora.type = "time";
  hora.required = true;
  hora.value = String(cita.hora).slice(0, 5);

  const guardar = document.createElement("button");
  guardar.type = "submit";
  guardar.textContent = "Guardar nueva cita";

  const cerrar = document.createElement("button");
  cerrar.type = "button";
  cerrar.textContent = "No cambiar";
  cerrar.className = "secondary";
  cerrar.addEventListener("click", () => formulario.remove());

  formulario.append(
    etiquetaFecha, fecha,
    etiquetaHora, hora,
    guardar, cerrar
  );

  formulario.addEventListener("submit", async evento => {
    evento.preventDefault();

    if (!fecha.value || !hora.value) {
      alert("Selecciona una fecha y una hora.");
      return;
    }

    const dia = new Date(fecha.value + "T12:00:00").getDay();

    if (dia === 4) {
      alert("La barbería cierra los jueves. Elige otro día.");
      return;
    }

    if (hora.value < "11:00" || hora.value >= "20:00") {
      alert("El horario de atención es de 11:00 a 20:00.");
      return;
    }

    guardar.disabled = true;
    await reagendarCita(cita, fecha.value, hora.value);
    guardar.disabled = false;
  });

  tarjeta.appendChild(formulario);
}

async function reagendarCita(cita, nuevaFecha, nuevaHora) {
  try {
    const { data, error } = await db
      .from("reservas")
      .update({
        fecha: nuevaFecha,
        hora: nuevaHora
      })
      .eq("id", cita.id)
      .eq("estado", cita.estado)
      .select("id");

    if (error) {
      console.error("Error al reagendar:", error);

      if (
        error.code === "23505" ||
        (error.message || "").includes("reservas_horario_activo")
      ) {
        alert("Ese horario ya está ocupado. Prueba con otra hora.");
      } else {
        alert("No se pudo reagendar la cita. Comprueba los permisos.");
      }
      return;
    }

    if (!data || data.length === 0) {
      alert("La cita cambió o ya fue modificada. Actualiza la lista.");
      return;
    }

    await cargarReservas();
    alert(
      "Cita reagendada correctamente. Recuerda avisar al cliente: " +
      "el aviso automático del cambio de horario aún no está configurado."
    );
  } catch (error) {
    console.error(error);
    alert("Ocurrió un error al reagendar la cita.");
  }
}

async function restaurarCita(cita) {
  if (!confirm(
    "¿Restaurar la cita de " + cita.nombre +
    " como pendiente de confirmación?"
  )) {
    return;
  }

  const { data, error } = await db
    .from("reservas")
    .update({ estado: "pendiente" })
    .eq("id", cita.id)
    .eq("estado", "cancelada")
    .select("id");

  if (error) {
    console.error("Error al restaurar:", error);

    if (
      error.code === "23505" ||
      (error.message || "").includes("reservas_horario_activo")
    ) {
      alert(
        "No se puede restaurar esa cita porque su horario ya está ocupado. " +
        "Reagenda la cita a un horario libre."
      );
    } else {
      alert("No se pudo restaurar la cita. Comprueba los permisos.");
    }
    return;
  }

  if (!data || data.length === 0) {
    alert("La cita ya cambió de estado. Actualiza la lista.");
    return;
  }

  await cargarReservas();
  alert("Cita restaurada como pendiente de confirmación.");
}

async function cambiarEstado(id, nuevoEstado, estadoActual) {
  if (!confirm("¿Quieres cambiar el estado a " + nuevoEstado + "?")) {
    return;
  }

  const { data, error } = await db
    .from("reservas")
    .update({ estado: nuevoEstado })
    .eq("id", id)
    .eq("estado", estadoActual)
    .select("id");

  if (error || !data || data.length === 0) {
    console.error(error);
    decir("No se pudo actualizar la cita. Comprueba su estado y los permisos.");
    return;
  }

  if (nuevoEstado === "confirmada" || nuevoEstado === "cancelada") {
    try {
      const { data: sesionData } = await db.auth.getSession();
      const sesion = sesionData.session;

      if (sesion) {
        const respuesta = await fetch(
          "https://omptefmybwlhehgixkwa.supabase.co/functions/v1/notificar-cita",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + sesion.access_token,
              "apikey": "sb_publishable_2CWnYeLNuhix-vM4uRg2KA__1Clvgnf"
            },
            body: JSON.stringify({
              reserva_id: id,
              estado: nuevoEstado
            })
          }
        );

        if (!respuesta.ok) {
          console.error("La función de notificación devolvió un error.");
        }
      }
    } catch (errorAviso) {
      console.error("Error al enviar notificación:", errorAviso);
    }
  }

  await cargarReservas();
}


  document.getElementById("formLogin")
    .addEventListener("submit", async evento => {
      evento.preventDefault();

      const boton = document.getElementById("btnLogin");
      boton.disabled = true;
      decir("Comprobando acceso...");

      try {
        const { data, error } = await db.auth.signInWithPassword({
          email: document.getElementById("correo").value.trim(),
          password: document.getElementById("contrasena").value
        });

        if (error) {
          decir("No se pudo iniciar sesión. Revisa el correo y la contraseña.");
          return;
        }

        mostrarSesion(data.session);
        document.getElementById("contrasena").value = "";
        await cargarReservas();
      } catch (error) {
        console.error(error);
        decir("Error de conexión. Inténtalo nuevamente.");
      } finally {
        boton.disabled = false;
      }
    });

  document.getElementById("btnActualizar")
    .addEventListener("click", cargarReservas);

  document.getElementById("btnSalir")
    .addEventListener("click", async () => {
      await db.auth.signOut();
      mostrarSesion(null);
    });

  async function iniciar() {
    const { data, error } = await db.auth.getSession();

    if (error) {
      decir("No se pudo comprobar la sesión.");
      return;
    }

    mostrarSesion(data.session);

    if (data.session) {
      await cargarReservas();
    }
  }

  iniciar();
</script>
</body>
</html>
